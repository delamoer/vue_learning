<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>列表渲染</title>

    <script type="text/javascript" src="../js/vue.js"></script>
  </head>

  <body>
    <!--
      列表渲染：
        1、v-for：通过遍历数组或对象来渲染列表
                注意：
                  （1）、v-for必须使用key属性来唯一标识每个元素，key的值应该是一个唯一的字符串或数字，通常使用数据项的id作为key，不建议使用index作为key，因为index可能会发生变化，导致渲染性能下降和组件状态混乱
                  （2）、v-for可以用在template标签上，template标签不会被渲染到页面上，可以用来包裹多个元素
                  （3）、v-for可以和v-if一起使用，但v-if优先级比v-for高，会先执行v-if再执行v-for
                  （4）、v-for可以用在组件上，可以通过props传递数据给组件
                  （5）、v-for可以用在普通元素上，可以通过插值表达式来显示数据
        
        2、key的作用（重要！）：
          （1）提高渲染性能：Vue通过key来追踪每个节点的身份，从而重用和重新排序现有元素
          （2）保持组件状态：确保组件及其子组件/DOM的状态在列表变化时保持正确
          （3）避免渲染错误：防止就地复用导致的数据错位问题
        
        3、key的diff算法原理（虚拟DOM对比）：
          当数据变化时，Vue会：
          （1）生成新的虚拟DOM
          （2）对比新旧虚拟DOM（diff算法）
          （3）根据key找到相同的元素，复用真实DOM
          （4）只更新变化的部分，提高性能
          
          示例：假设有列表 [A, B, C]
          - 使用id作为key：插入D到开头 → [D, A, B, C]
            Vue会直接在开头插入D，A/B/C的DOM被复用 ✅
          - 使用index作为key：插入D到开头 → [D, A, B, C]
            Vue认为index=0的元素从A变成了D，会更新所有元素 ❌
        
        4、为什么不推荐用index作为key？
          问题1：破坏顺序操作（如头部插入）会导致全部重新渲染，性能差
          问题2：如果列表项包含输入框等状态，会导致状态混乱
          
          具体例子：
          初始数据：[{id:1, name:'张三'}, {id:2, name:'李四'}]
          渲染结果（用index）：
            <li key="0">张三 <input/></li>
            <li key="1">李四 <input/></li>
          
          在头部插入王五后：[{id:3, name:'王五'}, {id:1, name:'张三'}, {id:2, name:'李四'}]
          Vue会认为：
            key="0" 的内容从"张三"变成"王五" → 更新文本，但input状态保留！❌
            key="1" 的内容从"李四"变成"张三" → 更新文本，但input状态保留！❌
            key="2" 是新增的"李四" → 新建元素 ✅
          结果：输入框的内容和人名对不上！
        
        5、key的最佳实践：
          ✅ 推荐：使用数据项的唯一id（如person.id）
          ✅ 可以：使用其他稳定的唯一标识（如person.email）
          ⚠️ 特殊情况：仅用于展示、不会重排序、不包含状态时可以用index
          ❌ 禁止：使用随机数或不稳定的值（每次渲染都变化）
          ❌ 避免：在会重排序的列表中使用index
  -->
    <div id="root">
      <h2>人员列表</h2>
      <!-- 遍历列表渲染 -->
      <ul>
        <li v-for="(person, index) in persons" :key="person.id">
          {{ person.name }} - {{ person.age }}
        </li>
      </ul>
      <h2>汽车信息</h2>
      <!-- 遍历对象渲染 -->
      <ul>
        <li>名称: {{ car.name }}</li>
        <li>价格: {{ car.price }}</li>
        <li>颜色: {{ car.color }}</li>
      </ul> 

    </div>
    <script type="text/javascript">
      Vue.config.productionTip = false; //阻止vue在启动时产生生产提示
      const v = new Vue({
        data: {
          persons: [
            { id: 1, name: "张三", age: 18 },
            { id: 2, name: "李四", age: 19 },
            { id: 3, name: "王五", age: 20 },
          ],  
          car:{
            name: "奔驰",
            price: 1000000,
            color:  "red",
          }

        },
        methods: {
        },
      });
      v.$mount("#root");
    </script>
  </body>
</html>
