<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天气案例_深度监视</title>
  <script type="text/javascript" src="../js/vue.js"></script>
</head>


<body>
  <!--
      深度监视：
          （1）vue中的watch默认不监视对象内部值的变化（一层）
          （2）配置deep:true可以监视对象内部值的改变（多层）
      备注：
          （1）vue自身可以监视对象内部值的改变，但Vue提供的watch默认不监视
          （2）使用watch时根据数据的具体结构，决定是否采用深度监视
      
      watch的两种写法：
          （1）在配置对象中直接写watch选项
          （2）使用vm.$watch()方法（更灵活，可以动态添加监视）
  -->
  <div id="root">
    <h2>今天天气很{{info}}</h2>
    <button @click="changeWeather">切换天气</button>
    <hr>
    <h2>a的值是{{numbers.a}}</h2>
    <button @click="numbers.a++">点我a+1</button>
    <button @click="numbers.b++">点我b+1</button>
    <hr>
    <h3>演示：使用vm.$watch()动态监视c的值</h3>
    <h2>c的值是{{numbers.c}}</h2>
    <button @click="numbers.c++">点我c+1</button>
  </div>
  <script type="text/javascript">
    Vue.config.productionTip = false; //阻止vue在启动时产生生产提示
    const v = new Vue({

      data: {
        isHot: true,
        numbers: {
          a: 1,
          b: 2,
          c: 3
        }
      },
      computed: {
        info() {
          return this.isHot ? "炎热" : "凉爽"
        }
      },
      methods: {
        changeWeather() {
          this.isHot = !this.isHot
        }
      },
      watch: {
        isHot: {
          immediate: false,
          handler(newvalue, oldvalue) {
            console.log("isHot发生了变化", newvalue, oldvalue)
          }
        },
        //监视多级属性中某个属性的变化
        "numbers.a": {
          immediate: false,
          handler(newvalue, oldvalue) {
            console.log("a发生了变化", newvalue, oldvalue)
          }
        },
        numbers: {
          deep: true,//开启深度监视
          immediate: false,
          handler(newvalue, oldvalue) {
            console.log("numbers发生了变化", newvalue, oldvalue)
          }
        }
      }
    },

    )
    v.$mount("#root")
    
    // 使用vm.$watch()方法监视数据（watch的第二种写法）
    // 这种方式更灵活，可以在任何时候动态添加监视
    v.$watch('numbers.c', {
      immediate: true,  // 立即执行
      deep: false,      // 是否深度监视
      handler(newValue, oldValue) {
        console.log("c的值发生了变化（通过$watch监视）", newValue, oldValue)
      }
    })
    
    // $watch的简写形式（当不需要配置immediate、deep等选项时）
    // v.$watch('numbers.c', function(newValue, oldValue) {
    //   console.log("c的值发生了变化", newValue, oldValue)
    // })

    // ============================================================
    // 补充：$watch 返回值 —— 取消监听（防内存泄漏）
    // ============================================================
    // $watch() 返回一个取消函数（unwatch），调用后停止该监听器
    // 重要！在组件的 beforeDestroy 钩子中取消动态创建的监听器
    // 否则组件销毁后监听器仍存活 → 内存泄漏

    const unwatch = v.$watch('numbers.a', function(newVal, oldVal) {
      console.log('[可取消的监听] numbers.a 变化:', oldVal, '->', newVal)
    })

    // 3 秒后自动取消监听（模拟组件 beforeDestroy）
    setTimeout(function() {
      unwatch()  // 调用后，numbers.a 的变化不再被该监听器捕获
      console.log('[取消监听] numbers.a 的动态监听已停止，修改 numbers.a 不再触发上面的回调')
    }, 3000)

    // 典型应用场景：
    //
    // export default {
    //   created() {
    //     // 满足某条件后才开始监听
    //     if (this.needWatch) {
    //       this._unwatchFoo = this.$watch('foo', this.onFooChange)
    //     }
    //   },
    //   beforeDestroy() {
    //     // 组件销毁时务必取消，防止内存泄漏
    //     if (this._unwatchFoo) this._unwatchFoo()
    //   }
    // }
  </script>
</body>

</html>
